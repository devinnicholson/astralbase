name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: "1.85"
            full: false
          - os: ubuntu-latest
            rust: stable
            full: true
          - os: macos-latest
            rust: stable
            full: true
          - os: windows-latest
            rust: stable
            full: true
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Astralbase
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check out frozen Bitmesh candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: devinnicholson/bitmesh
          ref: 28aee03bf1acb299fc82d5119f37893264e070e4
          path: _upstream/bitmesh
          persist-credentials: false

      - name: Check out frozen Thermograph candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: devinnicholson/thermograph
          ref: 57df043a5940f4ea3bf29fcb7920f369e035030c
          path: _upstream/thermograph
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy,rustfmt

      - name: Smoke frozen release-candidate resolution
        run: >-
          cargo
          --config 'patch."crates-io".bitmesh.path="_upstream/bitmesh"'
          --config 'patch."crates-io".thermograph.path="_upstream/thermograph"'
          check --locked --no-default-features

      - name: Test reusable engine on minimum Rust
        if: ${{ !matrix.full }}
        run: >-
          cargo
          --config 'patch."crates-io".bitmesh.path="_upstream/bitmesh"'
          --config 'patch."crates-io".thermograph.path="_upstream/thermograph"'
          test --locked --no-default-features --lib

      - name: Check formatting
        if: ${{ matrix.full }}
        run: cargo fmt --check

      - name: Lint all targets
        if: ${{ matrix.full }}
        run: >-
          cargo clippy
          --config 'patch."crates-io".bitmesh.path="_upstream/bitmesh"'
          --config 'patch."crates-io".thermograph.path="_upstream/thermograph"'
          --locked --all-targets --all-features -- -D warnings

      - name: Test all targets
        if: ${{ matrix.full }}
        run: >-
          cargo
          --config 'patch."crates-io".bitmesh.path="_upstream/bitmesh"'
          --config 'patch."crates-io".thermograph.path="_upstream/thermograph"'
          test --locked --all-targets --all-features

      - name: Build strict API documentation
        if: ${{ matrix.full }}
        run: >-
          cargo
          --config 'patch."crates-io".bitmesh.path="_upstream/bitmesh"'
          --config 'patch."crates-io".thermograph.path="_upstream/thermograph"'
          rustdoc --locked --lib --all-features -- -D missing-docs

      - name: Run five-minute reusable example
        if: ${{ matrix.full }}
        run: >-
          cargo
          --config 'patch."crates-io".bitmesh.path="_upstream/bitmesh"'
          --config 'patch."crates-io".thermograph.path="_upstream/thermograph"'
          run --locked --no-default-features --example bounded_retrograde
