name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: "1.88"
            full: false
          - os: ubuntu-latest
            rust: stable
            full: true
          - os: macos-latest
            rust: stable
            full: true
          - os: windows-latest
            rust: stable
            full: true
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Astralbase
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy,rustfmt

      - name: Install independent chess oracle
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v4
        with:
          python-version: "3.12"

      - name: Verify frozen transitions with python-chess
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: |
          python -m pip install -r requirements-oracle.txt
          python scripts/verify_python_chess_oracle.py

      - name: Smoke candidate dependency resolution
        run: cargo check --locked --no-default-features

      - name: Test reusable engine on minimum Rust
        if: ${{ !matrix.full }}
        run: cargo test --locked --no-default-features --lib

      - name: Test default reusable surface
        if: ${{ matrix.full }}
        run: cargo test --locked --no-default-features --lib --tests

      - name: Check formatting
        if: ${{ matrix.full }}
        run: cargo fmt --check

      - name: Lint all targets
        if: ${{ matrix.full }}
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test all targets
        if: ${{ matrix.full }}
        run: cargo test --locked --all-targets --all-features

      - name: Build strict API documentation
        if: ${{ matrix.full }}
        run: cargo rustdoc --locked --lib --all-features -- -D warnings -D missing-docs

      - name: Run five-minute reusable example
        if: ${{ matrix.full }}
        run: cargo run --locked --no-default-features --example bounded_retrograde

      - name: Generate and verify deterministic sample artifact
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: >-
          cargo run --locked --features partizan-dataset -- --sample-label-artifact target/ci-sample-artifact
          &&
          cargo run --locked --features partizan-dataset -- --verify-artifact target/ci-sample-artifact/manifest.json

      - name: Verify package assembly
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo package --locked

      - name: Test exact packaged source
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        shell: bash
        run: |
          mkdir -p target/package/extracted-ci
          tar -xzf target/package/astralbase-0.1.0.crate -C target/package/extracted-ci
          packaged_manifest="target/package/extracted-ci/astralbase-0.1.0/Cargo.toml"

          cargo test --locked --manifest-path "$packaged_manifest" \
            --no-default-features --lib --tests

          cargo test --locked --manifest-path "$packaged_manifest" \
            --all-targets --features partizan-dataset
